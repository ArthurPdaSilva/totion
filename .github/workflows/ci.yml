name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate project files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const requiredFiles = [
            "AGENTS.md",
            "README.md",
            "opencode.json",
            "package.json",
            "package-lock.json",
          ];

          for (const file of requiredFiles) {
            if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
              throw new Error(`${file} não existe ou está vazio`);
            }
          }

          const config = JSON.parse(fs.readFileSync("opencode.json", "utf8"));

          if (config.$schema !== "https://opencode.ai/config.json") {
            throw new Error("opencode.json deve usar o schema oficial do OpenCode");
          }

          for (const instruction of ["README.md", "AGENTS.md"]) {
            if (!config.instructions?.includes(instruction)) {
              throw new Error(`opencode.json deve carregar ${instruction}`);
            }
          }

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const requiredScripts = ["build", "typecheck", "biome:check", "test"];

          for (const script of requiredScripts) {
            if (!packageJson.scripts?.[script]) {
              throw new Error(`package.json deve definir o script ${script}`);
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run Biome
        run: npm run biome:check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
